version: '3.8'
services:
  postgres:
    image: postgres:16.3-alpine3.19
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - test-application
networks:
  test-application:
    driver: bridge
volumes:
  pgdata: